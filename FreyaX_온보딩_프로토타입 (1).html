<title>FreyaX — 맞춤 온보딩 프로토타입</title>

<style>
  :root{
    --bg: #FBF9FD;
    --surface: #FFFFFF;
    --ink: #2A2138;
    --ink-soft: #7A7189;
    --rose: #6C4AB6;
    --rose-deep: #4A2E85;
    --apricot: #8A63D2;
    --line: #E7DFF5;
    --ring-track: #E9E1F8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(circle at 20% 0%, #F3EEFA 0%, var(--bg) 45%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .phone{
    width:390px;
    max-width:100%;
    background:var(--surface);
    border-radius:36px;
    box-shadow: 0 30px 60px -20px rgba(163,70,93,0.25), 0 2px 8px rgba(58,42,51,0.06);
    overflow:hidden;
    position:relative;
    min-height:760px;
    display:flex;
    flex-direction:column;
    border:1px solid var(--line);
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:24px 24px 8px;
  }
  .back-btn{
    width:34px;height:34px;border-radius:50%;
    border:1px solid var(--line);
    background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--ink-soft);
    font-size:16px;
    transition:opacity .2s;
  }
  .back-btn:disabled{opacity:0;pointer-events:none;}
  .ring-wrap{ position:relative; width:34px; height:34px; margin-left:auto; }
  .ring-wrap svg{ transform:rotate(-90deg); }
  .ring-track{ stroke:var(--ring-track); stroke-width:4; fill:none; }
  .ring-fill{ stroke:var(--rose); stroke-width:4; fill:none; stroke-linecap:round; transition:stroke-dashoffset .5s ease; }
  .ring-label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:600; color:var(--rose-deep);
  }
  .content{
    flex:1;
    padding:8px 28px 28px;
    display:flex;
    flex-direction:column;
  }
  .eyebrow{
    font-size:12px;
    font-weight:600;
    color:var(--apricot);
    letter-spacing:0.04em;
    margin-bottom:10px;
  }
  h1{
    font-family:'Noto Sans KR', sans-serif;
    font-size:23px;
    line-height:1.4;
    font-weight:900;
    margin:0 0 8px;
    letter-spacing:-0.02em;
  }
  .subtitle{
    font-size:14px;
    color:var(--ink-soft);
    margin:0 0 28px;
    line-height:1.6;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option{
    text-align:left;
    padding:16px 18px;
    border-radius:16px;
    border:1.5px solid var(--line);
    background:var(--surface);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:4px;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .option:hover{ border-color:#C9B4EC; background:#FAF8FD; }
  .option:active{ transform:scale(0.98); }
  .option.selected{
    border-color:var(--rose);
    background:linear-gradient(0deg, #F1E9FB, #F1E9FB);
  }
  .option-label{ font-size:15px; font-weight:600; color:var(--ink); }
  .option-desc{ font-size:12.5px; color:var(--ink-soft); }
  .footer-note{
    margin-top:auto;
    padding-top:24px;
    font-size:11.5px;
    color:var(--ink-soft);
    text-align:center;
    line-height:1.6;
  }
  .text-input{
    width:100%;
    padding:16px 18px;
    border-radius:16px;
    border:1.5px solid var(--line);
    background:var(--surface);
    font-size:16px;
    font-family:'Noto Sans KR', sans-serif;
    color:var(--ink);
    outline:none;
  }
  .text-input:focus{ border-color:var(--rose); }
  /* result screen */
  .result{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding-top:12px;
  }
  .badge{
    display:inline-block;
    padding:6px 14px;
    border-radius:999px;
    background:#F1E9FB;
    color:var(--rose-deep);
    font-size:12px;
    font-weight:600;
    margin-bottom:18px;
  }
  .result h1{ font-size:21px; }
  .result p{ font-size:13.5px; color:var(--ink-soft); line-height:1.7; margin-bottom:22px;}
  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-bottom:26px;
  }
  .tag{
    font-size:12px;
    padding:6px 12px;
    border-radius:10px;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--ink);
  }
  .cycle-art{ width:120px; height:120px; margin-bottom:18px; }
  .cta{
    width:100%;
    padding:16px;
    border-radius:16px;
    border:none;
    background: linear-gradient(135deg, var(--rose), var(--rose-deep));
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 12px 24px -8px rgba(163,70,93,0.5);
  }
  .cta:active{ transform:scale(0.98); }
  .restart{
    margin-top:14px;
    background:none;border:none;
    color:var(--ink-soft);
    font-size:12.5px;
    text-decoration:underline;
    cursor:pointer;
  }
</style>
</head>

let stepIndex = 0; // 0 = segment select
let history = [];

function currentStepConfig(){
  if(stepIndex >= 0 && stepIndex <= 4){
    return bufferSteps[stepIndex];
  }
  if(stepIndex === 5){
    return {
      key:'segment',
      eyebrow:'맞춤 설정',
      title:'지금 가장 필요한 것은 무엇인가요?',
      subtitle:'편하게 답해주세요, 이 선택에 맞춰 다음 질문을 준비할게요',
      options:[
        {value:'natural', label:'자연임신 시도 중이에요', desc:'처음 · 둘째 이상 모두 해당돼요'},
        {value:'procedure', label:'시술을 준비하고 있어요', desc:'인공수정 · 체외수정 등'},
        {value:'diet', label:'식단 · 컨디션 관리가 필요해요', desc:'체중, 호르몬, 생활습관 관리'}
      ]
    };
  }
  if(stepIndex === 6) return sharedPreSteps[0];
  if(stepIndex === 7) return sharedPreSteps[1];
  if(stepIndex === 8) return sharedPreSteps[2];
  if(stepIndex >= 9 && stepIndex <= 16){
    const branch = branchQuestions[answers.segment];
    return branch[stepIndex - 9];
  }
  if(stepIndex === 17) return commonSteps[0];
  if(stepIndex === 18) return commonSteps[1];
  return null; // result
}

function render(){
  const content = document.getElementById('content');
  const backBtn = document.getElementById('backBtn');
  backBtn.disabled = stepIndex === 0;

  updateRing();

  if(stepIndex > TOTAL_STEPS - 1){
    renderResult();
    return;
  }

  const cfg = currentStepConfig();
  const resolvedSubtitle = (cfg.subtitle || '').replace('{{nickname}}', answers.nickname ? `${answers.nickname}님` : '고객님');

  if(cfg.type === 'text'){
    content.innerHTML = `
      <div class="eyebrow">${cfg.eyebrow}</div>
      <h1>${cfg.title}</h1>
      <p class="subtitle">${resolvedSubtitle}</p>
      <input type="text" id="textInput" class="text-input" placeholder="${cfg.placeholder || ''}" maxlength="12" autocomplete="off" />
      <button class="cta" id="textNextBtn" style="margin-top:16px;">다음</button>
      <div class="footer-note">건너뛰어도 괜찮아요</div>
      <button class="restart" id="textSkipBtn">건너뛰기</button>
    `;
    const input = document.getElementById('textInput');
    input.focus();
    const advance = ()=>{
      answers[cfg.key] = input.value.trim() || null;
      history.push(stepIndex);
      stepIndex++; render();
    };
    document.getElementById('textNextBtn').addEventListener('click', advance);
    document.getElementById('textSkipBtn').addEventListener('click', ()=>{
      answers[cfg.key] = null;
      history.push(stepIndex);
      stepIndex++; render();
    });
    input.addEventListener('keydown', e=>{ if(e.key === 'Enter') advance(); });
    return;
  }

  content.innerHTML = `
    <div class="eyebrow">${cfg.eyebrow}</div>
    <h1>${cfg.title}</h1>
    <p class="subtitle">${resolvedSubtitle}</p>
    <div class="options">
      ${cfg.options.map(o => `
        <button class="option" data-value="${o.value}">
          <span class="option-label">${o.label}</span>
          ${o.desc ? `<span class="option-desc">${o.desc}</span>` : ''}
        </button>
      `).join('')}
    </div>
    <div class="footer-note">선택하시면 바로 다음 질문으로 넘어가요</div>
  `;

  content.querySelectorAll('.option').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const val = btn.dataset.value;
      answers[cfg.key] = val;
      history.push(stepIndex);
      const next = getNextStepIndex(stepIndex, cfg.key, val);
      setTimeout(()=>{ stepIndex = next; render(); }, 180);
      btn.classList.add('selected');
    });
  });
}

function getNextStepIndex(current, key, val){
  // 자연임신 분기 · b1 "이전에 임신·출산 경험이 있으신가요?"에서
  // '이번이 처음이에요'를 선택하면 자녀 수(b2)·터울(b3) 질문을 건너뛰고
  // 바로 b4 "임신을 시도한 지 얼마나 되셨나요?"로 이동
  if(key === 'b1' && answers.segment === 'natural' && val === 'first'){
    return current + 3;
  }
  return current + 1;
}

function updateRing(){
  const ring = document.getElementById('ringFill');
  const label = document.getElementById('ringLabel');
  const step = Math.min(stepIndex+1, TOTAL_STEPS);
  const pct = step / TOTAL_STEPS;
  const circumference = 2 * Math.PI * 14;
  ring.setAttribute('stroke-dasharray', circumference);
  ring.setAttribute('stroke-dashoffset', circumference * (1-pct));
  label.textContent = stepIndex > TOTAL_STEPS-1 ? '완료' : `${step}/${TOTAL_STEPS}`;
}

function renderResult(){
  const meta = segmentMeta[answers.segment];
  const tags = ['discover','self_awareness','priority','help_style','cycle_regular','clinic_visit','medication','b1','b2','b3','b4','b5','b6','b7','b8','age','device'].map(k=>answers[k]).filter(Boolean).map(v=>tagLabel[v]||v);
  const greetName = answers.nickname ? `${answers.nickname}님, ` : '';
  document.getElementById('content').innerHTML = `
    <div class="result">
      <svg class="cycle-art" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="46" fill="none" stroke="#E9E1F8" stroke-width="6"/>
        <circle cx="60" cy="60" r="46" fill="none" stroke="#6C4AB6" stroke-width="6"
          stroke-dasharray="289" stroke-dashoffset="70" stroke-linecap="round" transform="rotate(-90 60 60)"/>
        <circle cx="60" cy="14" r="5" fill="#8A63D2"/>
      </svg>
      <div class="badge">${meta.badge}</div>
      <h1>${greetName}${meta.title}</h1>
      <p>${meta.desc}</p>
      <div class="tags">
        ${tags.map(t=>`<span class="tag">${t}</span>`).join('')}
      </div>
      <button class="cta" id="startBtn">맞춤 홈 화면으로 시작하기</button>
      <button class="restart" id="restartBtn">처음부터 다시 해보기</button>
    </div>
  `;
  document.getElementById('startBtn').addEventListener('click', ()=>{
    alert('프로토타입: 여기서 세그먼트별 맞춤 홈 화면으로 연결됩니다.');
  });
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    stepIndex = 0; history = [];
    Object.keys(answers).forEach(k=>answers[k]=null);
    render();
  });
}

document.getElementById('backBtn').addEventListener('click', ()=>{
  if(history.length){
    stepIndex = history.pop();
    render();
  }
});

render();
</script>
